<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yıldırım Roket Takımı - ÖSYM Tercih Sonuç Açıklama Sistemi</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Dynamic Cosmic Space Background -->
  <div class="space-bg">
    <div class="space-stars"></div>
    <div class="floating-rockets">
      <div class="floating-rocket">🚀</div>
      <div class="floating-rocket">🛰️</div>
      <div class="floating-rocket">🌊</div>
    </div>
  </div>

  <div class="app-container">

    <!-- Minimal Header -->
    <header class="main-header">
      <div class="header-brand">
        <img src="logo.png" alt="Yıldırım Roket Takımı Logo" class="brand-logo-img" />
        <div class="brand-text">
          <h1>Yıldırım Roket Takımı</h1>
          <span class="brand-badge">YSYM • 2026</span>
        </div>
      </div>
      <p class="header-subtitle">2026 Tercih Sonuç Açıklama Sistemi</p>
    </header>

    <!-- Clean Search Card -->
    <main>
      <section class="search-card">
        <div class="search-form-group">
          <label class="input-label" for="name-input">
            <span>Adı Soyadı</span>
          </label>
          <div class="input-wrapper">
            <span class="input-icon">🔍</span>
            <input 
              type="text" 
              id="name-input" 
              class="search-input" 
              placeholder="Adı Soyadı" 
              autocomplete="off" 
              autofocus 
            />
            <button type="button" id="clear-btn" class="clear-btn" title="Temizle">✕</button>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" id="query-btn" class="btn-query">
            <span class="rocket-icon">🚀</span>
            <span>Sorgula</span>
          </button>
        </div>
      </section>

      <!-- Suspense Loading Screen -->
      <section id="query-loading" class="query-loading">
        <div class="rocket-loader">🚀</div>
        <h3>Sorgulanıyor...</h3>
      </section>

      <!-- ÖSYM Result Document Section -->
      <section id="result-section" class="result-section">
        <!-- Rendered Document will be inserted here -->
        <div id="osym-document-content"></div>

        <!-- Controls Bar below Document -->
        <div class="result-controls-bar">
          <button type="button" id="print-doc-btn" class="control-btn print">
            <span>🖨️</span>
            <span>Belgeyi Yazdır / PDF İndir</span>
          </button>
          <button type="button" id="repeat-confetti-btn" class="control-btn confetti">
            <span>🎉</span>
            <span>Konfetiyi Patlat!</span>
          </button>
          <button type="button" id="sound-toggle-btn" class="control-btn sound">
            <span>🔊</span>
            <span>Ses: Açık</span>
          </button>
          <button type="button" id="new-search-btn" class="control-btn new-search">
            <span>🔍</span>
            <span>Yeni Sorgulama Yap</span>
          </button>
        </div>
      </section>
    </main>

  </div>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="confetti.js"></script>
  <script src="app.js"></script>
</body>
</html>
